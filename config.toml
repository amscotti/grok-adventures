# Grok Adventures Configuration
#
# CLI overrides (session only):
#   --name / -n NAME        character name (skips the name prompt)
#   --class CLASS           fighter | rogue | wizard | cleric | none
#   --load SLOT             load saves/SLOT.json (or an explicit path)
#   --minimal               linear block UI (default)
#   --fullscreen            ratatui sticky status + scrollback
#   --autopilot             AI player stress test (always minimal; no STT/TTS)
#   --scripted-autopilot    with --autopilot: fixed action rotation (no second model)
#   --player-style STYLE    with --autopilot: cautious | balanced | reckless
#   --turns N               autopilot turn cap (default 20)
#   --no-tts                disable DM speech for this session
#   --no-stt                disable push-to-talk for this session
#   --config PATH           this file (default config.toml)
#
# Environment wins over this file. Set XAI_API_KEY (or [xai].api_key below);
# there is no offline mode.
#   XAI_API_KEY, XAI_MODEL, XAI_PLAYER_MODEL, XAI_REASONING_EFFORT,
#   XAI_STT_MODEL, GROK_ADVENTURES_PLAYER_STYLE,
#   GROK_ADVENTURES_SCRIPTED_AUTOPILOT=1, GROK_ADVENTURES_DEBUG=1,
#   NO_COLOR, RUST_LOG
#
# Unknown/removed keys are ignored, so older config files still load.
# Rules: dnd5e-lite (d20 + ability modifier, standard dice, HP, inventory,
# initiative, homebrew rests; no AC/proficiency/levels/spell slots).

[xai]
api_key = ""  # Prefer the XAI_API_KEY environment variable or .env
# Latest Grok. Override with XAI_MODEL / XAI_PLAYER_MODEL.
model = "grok-4.7"
player_model = "grok-4.7"
# low keeps tool turns snappy. Options: low | medium | high | xhigh.
reasoning_effort = "low"

[ui]
# fullscreen = ratatui TUI; minimal = linear block print (default)
mode = "minimal"          # minimal | fullscreen
# Fullscreen theme; /theme cycles groknight -> grokday -> mono.
# Minimal mode uses the fixed GrokNight palette.
theme = "groknight"       # groknight | grokday | mono
compact = false           # tighter fullscreen density
tools_expanded = false    # collapse tool groups by default
show_shortcuts = true

[voice]
# Player input: typing is always on. STT is optional:
#   minimal mode: `talk` (record until Enter)
#   fullscreen:   hold Ctrl+Space (or F2) to talk, release to send (or `talk`)
enable_stt = true
# Insert transcript into the prompt for editing (true) vs auto-submit (false)
stt_edit_before_send = true
# DM output speech (independent of whether the player typed or spoke)
enable_tts = true
# DM voice — options include zagan (dramatic), orion (cinematic), luna (gentle),
# eve (energetic), rigel (precise professional)
dm_voice = "zagan"

[game]
# Tone: dark_fantasy | heroic | comedic. Other values fall back to heroic.
tone = "heroic"
# Prior player/DM exchanges kept as chat messages (0 = state+log only)
history_turns = 8

[stt]
# Latest xAI transcription model. Override with XAI_STT_MODEL.
model = "grok-voice-transcribe-2.0"
# Language for formatted transcripts (format=true is always sent).
language = "en"
# Show words while you speak. false = upload the clip after you stop.
streaming = true
# Recording device index (-1 for default)
device = -1
# Sample rate
sample_rate = 16000
# Fullscreen `/talk` with no argument uses this default.
# Minimal `/talk` and fullscreen hold-to-talk use max_record_seconds instead.
record_seconds = 12
# Hard cap for `/talk` and hold-to-talk in both UIs
max_record_seconds = 60
