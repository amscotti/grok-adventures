[package]
name = "grok_adventures"
version = "0.1.0"
edition = "2024"
description = "CLI dungeon master — Grok narrates, Rust keeps score"
license = "MIT"
readme = "README.md"
default-run = "grok-adventures"

[[bin]]
name = "grok-adventures"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.0"
clap = { version = "4", features = ["derive", "env"] }
cpal = "0.15"
crossterm = "0.28"
dotenvy = "0.15"
futures-util = { version = "0.3.34", features = ["sink"] }
hound = "3"
owo-colors = "4"
rand = "0.9"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
